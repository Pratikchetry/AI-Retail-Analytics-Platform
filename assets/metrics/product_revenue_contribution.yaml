version: "1.0"

metric_name: Product Revenue Contribution

business_definition: >
  Percentage of total company revenue generated by a product.

formula: >
  product_revenue / total_revenue * 100

preferred_tables:
  - product_revenue_contribution

preferred_columns:
  - description
  - total_revenue
  - revenue_contribution_pct

business_interpretation: >
  Identifies key products driving business performance.

common_questions:
  - Which products contribute most revenue?
  - Top revenue generating products?
  - Revenue share by product?

sql_pattern: >
  SELECT
      description,
      revenue_contribution_pct
  FROM product_revenue_contribution