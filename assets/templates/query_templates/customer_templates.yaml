version: "1.0"

domain: Customer

templates:

  segment_revenue:
    preferred_table: customer_segment_revenue

    sql_template: |
      SELECT
          customer_segment,
          total_revenue
      FROM customer_segment_revenue
      ORDER BY total_revenue DESC

  segment_profile:
    preferred_table: customer_segment_profile

    sql_template: |
      SELECT *
      FROM customer_segment_profile

  champions:
    preferred_table: dim_customer

    sql_template: |
      SELECT
          customer_id
      FROM dim_customer
      WHERE customer_segment = 'Champions'