name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r requirements.txt

      - name: ✨ Lint Code (Ruff)
        run: ruff check src/ || true

      - name: 🧪 Import Validation
        env:
          PYTHONPATH: .
        run: |
          python -c "import src.langgraph.graph; print('LangGraph Brain OK')"
          python -c "import src.app.api; print('FastAPI OK')"
          python -c "import src.pipeline; print('Data Pipeline OK')"

      - name: 🧠 Router Unit Test (Requires Groq Secret)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONPATH: .
        run: python tests/test_router.py
        continue-on-error: true